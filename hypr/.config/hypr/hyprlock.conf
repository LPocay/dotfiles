# Terminal Prompt — hyprland-rice.pen / aMbJ6 (1600 × 900).
# Horizontal anchors follow each output; auth controls keep a readable height.
# Hyprlock font sizes are points (the design uses pixels).
$font = JetBrains Mono
$accent = rgb(A3BE8C)
$text = rgb(E2E8D9)
$rule = rgb(4B6752)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.config/hypr/assets/lock-background.png
    color = rgb(11211C)
    blur_passes = 0
    zindex = -2
}

shape {
    monitor =
    size = 39.375%, 100%
    color = rgba(0A100FB2)
    rounding = 0
    position = 0, 0
    halign = right
    valign = center
    zindex = -1
}

# Perimeter and left clock accent.
shape {
    monitor =
    size = 92%, 1
    color = $rule
    rounding = 0
    position = 0, -9.7778%
    halign = center
    valign = top
}

shape {
    monitor =
    size = 92%, 1
    color = $rule
    rounding = 0
    position = 0, 11.2222%
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 2, 53.5556%
    color = $accent
    rounding = 0
    position = 4%, -15.2222%
    halign = left
    valign = top
}

label {
    monitor =
    text = <span weight="bold" letter_spacing="2000">// TERMINAL PROMPT</span>
    color = $accent
    font_size = 11
    font_family = $font
    position = 4%, -4.4444%
    halign = left
    valign = top
}

label {
    monitor =
    text = <span letter_spacing="1000">SECURE SESSION  /  01</span>
    color = rgb(8FA592)
    font_size = 9
    font_family = $font
    position = -4%, -4.8889%
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] printf '<span letter_spacing="2000">%s</span>' "$(LC_TIME=C date +'%A  ·  %B %d, %Y' | tr '[:lower:]' '[:upper:]')"
    color = $accent
    font_size = 12
    font_family = $font
    position = 6.125%, -19.7778%
    halign = left
    valign = top
}

label {
    monitor =
    text = <span letter_spacing="-8000">$TIME</span>
    color = $text
    font_size = 130
    font_family = $font
    position = 5%, -25.1111%
    halign = left
    valign = top
}

shape {
    monitor =
    size = 29.25%, 2
    color = $accent
    rounding = 0
    position = 6.25%, -51.7778%
    halign = left
    valign = top
}

label {
    monitor =
    text = Your session is waiting.
    color = rgb(D4DECF)
    font_size = 19
    font_family = $font
    position = 6.25%, -56.7778%
    halign = left
    valign = top
}

label {
    monitor =
    text = &gt; authenticate to continue_
    color = rgb(94AB95)
    font_size = 11
    font_family = $font
    position = 6.25%, -61.8889%
    halign = left
    valign = top
}

label {
    monitor =
    text = <span weight="bold" letter_spacing="1000">LOCKED  /  HYPRLAND</span>
    color = $accent
    font_size = 10
    font_family = $font
    position = 6.25%, -77%
    halign = left
    valign = top
}

label {
    monitor =
    text = Only your password can unlock this session.
    color = rgb(9FAFA1)
    font_size = 10
    font_family = $font
    position = 6.25%, -80.1111%
    halign = left
    valign = top
}

# Identity check. Explicit z-indices keep labels/input above the panel.
shape {
    monitor =
    size = 31.375%, 375
    color = rgba(111913F2)
    rounding = 0
    border_size = 1
    border_color = rgb(58735D)
    position = -5%, 20.5
    halign = right
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span weight="bold" letter_spacing="2000">IDENTITY CHECK</span>
    color = $accent
    font_size = 10
    font_family = $font
    position = 65.625%, 169
    halign = left
    valign = center
    zindex = 2
}

label {
    monitor =
    text = [ LOCKED ]
    color = rgb(8AA48D)
    font_size = 8
    font_family = $font
    position = -7%, 169
    halign = right
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 27.375%, 1
    color = rgb(3E5643)
    rounding = 0
    position = -7%, 140
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor =
    text = USER  /  LOCAL ACCOUNT
    color = rgb(8DA18E)
    font_size = 9
    font_family = $font
    position = 65.625%, 113
    halign = left
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <b>$USER</b>
    color = $text
    font_size = 25
    font_family = $font
    position = 65.625%, 71
    halign = left
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 27.375%, 62
    outline_thickness = 1
    inner_color = rgb(0A100C)
    outer_color = rgb(739477)
    check_color = $accent
    fail_color = rgb(C4746E)
    capslock_color = rgb(C4B28A)
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.3
    dots_center = false
    placeholder_text = <span foreground="##889A89" size="11264">Enter password  _</span>
    check_text = <span size="11264">Authenticating…</span>
    fail_text = <span size="11264">Authentication failed ($ATTEMPTS)</span>
    position = -7%, -2
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor =
    text = ↵  PRESS ENTER TO UNLOCK
    color = $accent
    font_size = 9
    font_family = $font
    position = 65.625%, -60
    halign = left
    valign = center
    zindex = 2
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(9AAB9A)
    font_size = 9
    font_family = $font
    position = -7%, -60
    halign = right
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 27.375%, 1
    color = rgb(3E5643)
    rounding = 0
    position = -7%, -88
    halign = right
    valign = center
    zindex = 2
}

label {
    monitor =
    text = ESC clears input   •   Ctrl+U resets
    color = rgb(829683)
    font_size = 8
    font_family = $font
    position = 65.625%, -114
    halign = left
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:5000] count=$(timeout 1 quickshell ipc call notifications count 2>/dev/null); case "$count" in ''|*[!0-9]*) count=-- ;; ?) count=0$count ;; esac; printf '●  NOTIFICATIONS  /  %s' "$count"
    color = rgb(9FB6A1)
    font_size = 9
    font_family = $font
    position = 4%, 6.3333%
    halign = left
    valign = bottom
}

label {
    monitor =
    text = HYPRLOCK  /  SECURE ACCESS
    color = rgb(9FB6A1)
    font_size = 9
    font_family = $font
    position = -4%, 6.3333%
    halign = right
    valign = bottom
}
